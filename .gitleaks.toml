# EFEX Gitleaks Configuration
# ============================
# Custom rules for EFEX-specific secret patterns
# Combined with default gitleaks rules

[extend]
# Use the default gitleaks configuration as base
# This includes rules for AWS, GCP, GitHub tokens, etc.

# =============================================================================
# DEMO SECRET RULES - For vulnerable/ folder demonstration
# These detect intentionally placed demo secrets for Red/Green scenarios
# =============================================================================
[[rules]]
id = "efex-demo-hardcoded-secret"
description = "EFEX Demo Hardcoded Secret (intentional for demo)"
regex = '''HARDCODED_SECRET_FOR_DEMO[a-zA-Z0-9_]*'''
keywords = ["HARDCODED_SECRET"]
tags = ["efex", "demo", "credential"]

[[rules]]
id = "efex-demo-api-key"
description = "EFEX Demo API Key (intentional for demo)"
regex = '''DEMO_API_KEY_[a-zA-Z0-9_]+'''
keywords = ["DEMO_API_KEY"]
tags = ["efex", "demo", "api"]

[[rules]]
id = "efex-demo-jwt-secret"
description = "EFEX Demo JWT Secret (intentional for demo)"
regex = '''DEMO_JWT_SECRET_[a-zA-Z0-9_]+'''
keywords = ["DEMO_JWT_SECRET"]
tags = ["efex", "demo", "jwt"]

[[rules]]
id = "efex-demo-aws-key"
description = "EFEX Demo AWS Key (intentional for demo)"
regex = '''AKIADEMO[a-zA-Z0-9]+'''
keywords = ["AKIADEMO"]
tags = ["efex", "demo", "aws"]

[[rules]]
id = "efex-demo-generic"
description = "EFEX Demo Secret Pattern (intentional for demo)"
regex = '''DEMO_SECRET_[a-zA-Z0-9_]+'''
keywords = ["DEMO_SECRET"]
tags = ["efex", "demo", "credential"]

# =============================================================================
# EFEX Production Rules
# =============================================================================
[[rules]]
id = "efex-spei-token"
description = "EFEX SPEI API Token"
regex = '''spei_(?:prod|dev|staging)_tk_[a-zA-Z0-9]{16,}'''
keywords = ["spei_"]
tags = ["efex", "spei", "financial"]

[[rules]]
id = "efex-clabe"
description = "Mexican CLABE Account Number"
regex = '''\b[0-9]{18}\b'''
keywords = ["clabe", "cuenta"]
tags = ["efex", "financial", "pii"]
[rules.allowlist]
regexes = [
    # Allow test CLABEs
    '''646180000000000000''',
]

[[rules]]
id = "efex-database-password"
description = "EFEX Database Password Pattern"
regex = '''efex_(?:prod|dev|staging)_(?:password|pwd|pass)[^\s'"]{8,}'''
keywords = ["efex_prod", "efex_dev"]
tags = ["efex", "database", "credential"]

[[rules]]
id = "efex-internal-api-key"
description = "EFEX Internal API Key"
regex = '''efex_api_(?:key|token)_[a-zA-Z0-9]{32,}'''
keywords = ["efex_api"]
tags = ["efex", "api", "credential"]

[[rules]]
id = "stripe-live-key"
description = "Stripe Live API Key"
regex = '''sk_live_[a-zA-Z0-9]{24,}'''
keywords = ["sk_live"]
tags = ["stripe", "financial", "credential"]

[[rules]]
id = "mysql-connection-string"
description = "MySQL Connection String with Password"
regex = '''mysql://[^:]+:[^@]+@[^/]+/[^\s]+'''
keywords = ["mysql://"]
tags = ["database", "credential"]

[[rules]]
id = "jwt-secret"
description = "JWT Secret Key"
regex = '''(?i)jwt[_-]?secret[^\s]*[=:]\s*['"]?[a-zA-Z0-9_\-]{16,}['"]?'''
keywords = ["jwt"]
tags = ["auth", "credential"]

# Allowlist - files and paths to ignore
[allowlist]
description = "Global allowlist"
paths = [
    # Test files with mock data
    '''tests/fixtures/.*''',
    '''tests/mocks/.*''',
    # Documentation
    '''docs/.*\.md''',
    # Lock files
    '''.*lock.*''',
    # Remediated folder is secure - skip scanning
    '''remediated/.*''',
    # Evidence documentation
    '''evidence/.*''',
]
regexes = [
    # Example/placeholder values (but NOT DEMO_ patterns - those should be detected)
    '''EXAMPLE''',
    '''placeholder''',
    '''your-.*-here''',
    # NOTE: gitleaks:allow comments are NOT whitelisted
    # Demo secrets in vulnerable/ WILL be detected for RED scenario
]

# Commits to ignore (if any known false positives)
commits = []

# =============================================================================
# NOTE: The vulnerable/ folder is NOT in the allowlist
# This ensures that demo secrets in vulnerable/ WILL be detected
# demonstrating the Red scenario in CI/CD
# =============================================================================
