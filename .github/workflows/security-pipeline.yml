# EFEX Secure Software Factory - Security Pipeline
# =================================================
# Multi-layer DevSecOps pipeline with Policy-as-Code gates
#
# Branch-based scenarios:
#   - main, remediated branches  → GREEN scenario (secure code, pipeline PASSES)
#   - vulnerable-demo branch     → RED scenario (vulnerable code, pipeline FAILS)
#
# Layers:
#   1. Secrets Detection (gitleaks)
#   2. SAST - Static Application Security Testing (Semgrep)
#   3. SCA - Software Composition Analysis (Trivy)
#   4. IaC - Infrastructure as Code Security (Checkov + Conftest)
#   5. Container Security (Trivy + Dockerfile lint)
#   6. Policy Gate (orchestration)
#   7. SBOM + Signing (Syft + cosign)
#
# Regulatory Mapping: CNBV/IFPE, SOC 2 Type II, Banxico Circular 4/2021

name: EFEX Security Pipeline

on:
  push:
    branches: [main, vulnerable-demo, 'feature/**', 'fix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_signing:
        description: 'Skip SBOM signing (for testing)'
        required: false
        default: 'false'
      security_gate_mode:
        description: 'Security gate mode (observe/advise/enforce)'
        required: false
        default: 'enforce'
        type: choice
        options:
          - observe
          - advise
          - enforce

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Auto-detect scenario based on branch name:
  #   - vulnerable-demo branch → vulnerable (RED)
  #   - main/other branches    → remediated (GREEN)
  SCENARIO: ${{ contains(github.ref_name, 'vulnerable') && 'vulnerable' || 'remediated' }}
  DOCKERFILE_PATH: ${{ contains(github.ref_name, 'vulnerable') && 'vulnerable' || 'remediated' }}/Dockerfile
  # Security Gate Mode: observe (log only), advise (warn), enforce (block)
  SECURITY_GATE_MODE: ${{ inputs.security_gate_mode || vars.SECURITY_GATE_MODE || 'enforce' }}

# Cancel in-progress runs for same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# =============================================================================
# GLOBAL PERMISSIONS - Least Privilege Principle
# Default: read-only. Jobs expand permissions only where necessary.
# Control: SOC 2 CC6.3, CNBV Art. 316 Bis 12
# =============================================================================
permissions:
  contents: read

jobs:
  # ===========================================================================
  # LAYER 1: SECRETS DETECTION
  # Tool: gitleaks
  # Control: SOC 2 CC6.1, CNBV Art. 316 Bis
  # ===========================================================================
  secrets-scan:
    name: "🔐 Secrets Detection"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0  # Full history for comprehensive scan

      - name: Install Gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (scenario-aware)
        run: |
          echo "Scanning scenario: ${SCENARIO}"

          if [ "${SCENARIO}" == "remediated" ]; then
            # GREEN scenario: scan only remediated folder (no git history)
            echo "GREEN scenario: Scanning only remediated/ folder"
            gitleaks detect \
              --source "${SCENARIO}/" \
              --no-git \
              --config .gitleaks.toml \
              --report-format sarif \
              --report-path results.sarif \
              --verbose \
              --redact || GITLEAKS_EXIT=$?
          else
            # RED scenario: scan full repo including git history
            echo "RED scenario: Scanning full repository"
            gitleaks detect \
              --source . \
              --config .gitleaks.toml \
              --report-format sarif \
              --report-path results.sarif \
              --verbose \
              --redact || GITLEAKS_EXIT=$?
          fi

          if [ "${GITLEAKS_EXIT:-0}" -gt 0 ]; then
            echo "::error::EFEX-SEC-GATE: Secrets detected in ${SCENARIO}/"
            exit 1
          fi

      - name: Upload Gitleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: results.sarif
          category: gitleaks
        continue-on-error: true

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 30

  # ===========================================================================
  # LAYER 2: SAST - Static Application Security Testing
  # Tool: Semgrep
  # Control: SOC 2 CC6.6, OWASP Top 10, CWE
  # ===========================================================================
  sast-scan:
    name: "🔍 SAST Analysis"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          echo "Scanning: ${SCENARIO}/app/"
          semgrep scan \
            --config p/python \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/command-injection \
            --config p/sql-injection \
            --config .semgrep/ \
            --sarif \
            --output semgrep.sarif \
            --error \
            "${SCENARIO}/app/" || SEMGREP_EXIT=$?

          echo "Semgrep exit code: ${SEMGREP_EXIT:-0}"

          if [ "${SEMGREP_EXIT:-0}" -gt 0 ]; then
            echo "::error::EFEX-SEC-GATE: Semgrep found security vulnerabilities in ${SCENARIO}/app/"
            exit 1
          fi

      - name: Check for HIGH/CRITICAL findings
        if: always()
        run: |
          if [ -f semgrep.sarif ]; then
            # Count high severity findings (level: error in SARIF)
            HIGH_COUNT=$(jq '[.runs[].results[] | select(.level == "error")] | length' semgrep.sarif 2>/dev/null || echo "0")
            echo "High severity findings: $HIGH_COUNT"
            echo "## SAST Findings: $HIGH_COUNT high/critical" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-results
          path: semgrep.sarif
          retention-days: 30

  # ===========================================================================
  # LAYER 3: SCA - Software Composition Analysis
  # Tool: Trivy
  # Control: SOC 2 CC7.1, Banxico Circular 4/2021
  # ===========================================================================
  sca-scan:
    name: "📦 Dependency Scan (SCA)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Trivy vulnerability scanner (filesystem)
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SCENARIO }}/app'
          severity: 'CRITICAL,HIGH'
          # RED scenario (vulnerable): exit-code 1 to block
          # GREEN scenario (remediated): exit-code 0 to pass
          exit-code: ${{ env.SCENARIO == 'vulnerable' && '1' || '0' }}
          format: 'sarif'
          output: 'trivy-sca.sarif'
          ignore-unfixed: true
          vuln-type: 'library'

      - name: Generate human-readable report
        if: always()
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          scan-type: 'fs'
          scan-ref: '${{ env.SCENARIO }}/app'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          output: 'trivy-sca-report.txt'
          vuln-type: 'library'
        continue-on-error: true

      - name: Display findings summary
        if: always()
        run: |
          echo "## SCA Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat trivy-sca-report.txt >> "$GITHUB_STEP_SUMMARY" || echo "No report generated"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: trivy-sca.sarif
          category: trivy-sca
        continue-on-error: true

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-sca-results
          path: |
            trivy-sca.sarif
            trivy-sca-report.txt
          retention-days: 30

  # ===========================================================================
  # LAYER 4: IaC - Infrastructure as Code Security
  # Tools: Checkov + OPA/Conftest
  # Control: CNBV Art. 316 Bis 17, SOC 2 CC6.1, CC6.3
  # ===========================================================================
  iac-scan:
    name: "🏗️ IaC Security Scan"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Terraform Init (for plan)
        working-directory: ${{ env.SCENARIO }}/infra
        run: terraform init -backend=false
        continue-on-error: true

      # Checkov scan with custom checks
      - name: Run Checkov
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12
        with:
          directory: ${{ env.SCENARIO }}/infra/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif
          # RED scenario (vulnerable): hard fail on security issues
          # GREEN scenario (remediated): soft fail (best practice warnings only)
          soft_fail: ${{ env.SCENARIO == 'remediated' }}
          download_external_modules: false
          # Custom checks from policy/checkov/
          external_checks_dirs: policy/checkov
          # Skip non-security checks (cross-region, multi-AZ, etc.)
          skip_check: CKV_AWS_144,CKV_AWS_145,CKV_AWS_300,CKV_AWS_338,CKV_AWS_118,CKV_AWS_157,CKV_AWS_161,CKV_AWS_226,CKV2_AWS_62,CKV2_AWS_61,CKV2_AWS_60,CKV2_AWS_64,CKV_AWS_260,CKV_AWS_129,CKV2_AWS_5,CKV2_AWS_12
        continue-on-error: false

      # OPA/Conftest for custom EFEX policies
      - name: Setup Conftest
        run: |
          CONFTEST_VERSION="0.46.0"
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz
          sudo mv conftest /usr/local/bin/

      - name: Generate Terraform Plan JSON
        working-directory: ${{ env.SCENARIO }}/infra
        run: |
          terraform plan -out=tfplan -input=false 2>/dev/null || true
          terraform show -json tfplan > tfplan.json 2>/dev/null || echo '{}' > tfplan.json
        continue-on-error: true

      - name: Run Conftest (EFEX Custom Policies)
        run: |
          echo "Running EFEX custom OPA policies on ${SCENARIO}/infra..."
          conftest test "${SCENARIO}/infra/tfplan.json" \
            --policy policy/terraform \
            --output json \
            --all-namespaces \
            > conftest-results.json 2>&1 || true

          # Check for failures (only block for vulnerable scenario)
          FAILURES=$(jq '[.[] | select(.failures | length > 0)] | length' conftest-results.json 2>/dev/null || echo "0")
          if [ "$FAILURES" -gt 0 ]; then
            echo "::error::EFEX Policy violations detected:"
            jq -r '.[] | .failures[]? | "- \(.msg)"' conftest-results.json
            if [ "${SCENARIO}" == "vulnerable" ]; then
              exit 1
            fi
          fi
        continue-on-error: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: checkov-results.sarif
          category: checkov
        continue-on-error: true

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: iac-results
          path: |
            checkov-results.sarif
            conftest-results.json
          retention-days: 30

  # ===========================================================================
  # LAYER 5: CONTAINER SECURITY
  # Tools: Trivy (image), Hadolint (Dockerfile)
  # Control: SOC 2 CC6.8, CIS Docker Benchmark
  # ===========================================================================
  container-scan:
    name: "🐳 Container Security"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # For SARIF upload
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Display scenario info
        run: |
          echo "## Container Security Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "**Scenario:** \`${SCENARIO}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Dockerfile:** \`${DOCKERFILE_PATH}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: ${{ env.DOCKERFILE_PATH }}
          failure-threshold: error
          format: sarif
          output-file: hadolint.sarif
        continue-on-error: true

      - name: Check for root user in Dockerfile
        run: |
          DOCKERFILE="${DOCKERFILE_PATH}"
          echo "Checking: ${DOCKERFILE}"

          if ! grep -q "^USER" "${DOCKERFILE}"; then
            echo "::error::EFEX-SEC-004: Dockerfile must specify a non-root USER directive"
            echo "Add 'USER 1000:1000' before CMD instruction"
            exit 1
          fi

          if grep -q "^USER root" "${DOCKERFILE}"; then
            echo "::error::EFEX-SEC-005: Dockerfile explicitly runs as root"
            exit 1
          fi

          echo "✅ Dockerfile USER check passed"

      - name: Build container image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building from: ${DOCKERFILE_PATH}"
          docker build \
            -t "efex-app:${IMAGE_TAG}" \
            -f "${DOCKERFILE_PATH}" \
            "${SCENARIO}/"

      - name: Run Trivy container scan
        env:
          IMAGE_TAG: ${{ github.sha }}
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: 'efex-app:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          # RED scenario (vulnerable): exit-code 1 to block
          # GREEN scenario (remediated): exit-code 0 to pass
          exit-code: ${{ env.SCENARIO == 'vulnerable' && '1' || '0' }}
          format: 'sarif'
          output: 'trivy-container.sarif'
          ignore-unfixed: true
          vuln-type: 'library'

      - name: Generate container report
        if: always()
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8 # master
        with:
          image-ref: 'efex-app:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          format: 'table'
          output: 'trivy-container-report.txt'
          vuln-type: 'library'
        continue-on-error: true

      - name: Upload Hadolint SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: hadolint.sarif
          category: hadolint
        continue-on-error: true

      - name: Upload Trivy Container SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@47be0dbd5113ab1b79fe2dd3f68bdf7e426cdc87 # v3
        with:
          sarif_file: trivy-container.sarif
          category: trivy-container
        continue-on-error: true

      - name: Save scan results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: container-results
          path: |
            hadolint.sarif
            trivy-container.sarif
            trivy-container-report.txt
          retention-days: 30

  # ===========================================================================
  # WAIVER VALIDATION
  # Validates security exception waivers and checks for expiration
  # ===========================================================================
  # ===========================================================================
  # WAIVER VALIDATION
  # Validates security exception waivers and checks for expiration
  #
  # Behavior based on SECURITY_GATE_MODE:
  #   - observe: Log only, never block
  #   - advise:  Warn on expired waivers, don't block
  #   - enforce: Block build on expired/invalid waivers
  # ===========================================================================
  waiver-check:
    name: "📜 Waiver Validation"
    runs-on: ubuntu-latest
    outputs:
      expired_count: ${{ steps.validate.outputs.expired_count }}
      valid_count: ${{ steps.validate.outputs.valid_count }}
      waiver_status: ${{ steps.validate.outputs.waiver_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate waivers
        id: validate
        run: |
          echo "## 📜 Waiver Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Mode:** \`${SECURITY_GATE_MODE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Run waiver validation
          python scripts/validate-waivers.py --strict 2>&1 | tee waiver-output.txt || WAIVER_EXIT=$?

          # Parse results
          VALID=$(grep -oP 'Valid:\s+\K\d+' waiver-output.txt || echo "0")
          EXPIRED=$(grep -oP 'Expired:\s+\K\d+' waiver-output.txt || echo "0")
          INVALID=$(grep -oP 'Invalid:\s+\K\d+' waiver-output.txt || echo "0")

          echo "valid_count=${VALID}" >> "$GITHUB_OUTPUT"
          echo "expired_count=${EXPIRED}" >> "$GITHUB_OUTPUT"

          echo "| Status | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|--------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ✅ Valid | ${VALID} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ⚠️ Expired | ${EXPIRED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ❌ Invalid | ${INVALID} |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${EXPIRED}" -gt 0 ] || [ "${INVALID}" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"

            case "${SECURITY_GATE_MODE}" in
              observe)
                echo "ℹ️ **Mode: Observe** - Logging only, not blocking" >> "$GITHUB_STEP_SUMMARY"
                echo "waiver_status=warning" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              advise)
                echo "⚠️ **Mode: Advise** - Warning issued, not blocking" >> "$GITHUB_STEP_SUMMARY"
                echo "::warning::Expired/invalid waivers found. Action required before enforce mode."
                echo "waiver_status=warning" >> "$GITHUB_OUTPUT"
                exit 0
                ;;
              enforce)
                echo "🚫 **Mode: Enforce** - Build blocked due to expired/invalid waivers" >> "$GITHUB_STEP_SUMMARY"
                echo "::error::EFEX-SEC-GATE: Expired or invalid waivers detected. Renew or fix before merge."
                echo "waiver_status=failed" >> "$GITHUB_OUTPUT"
                exit 1
                ;;
            esac
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ All waivers valid" >> "$GITHUB_STEP_SUMMARY"
          echo "waiver_status=passed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload waiver report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: waiver-validation
          path: waiver-output.txt
          retention-days: 30

  # ===========================================================================
  # POLICY GATE - All security checks must pass
  # ===========================================================================
  security-gate:
    name: "🚦 Security Gate"
    needs: [secrets-scan, sast-scan, sca-scan, iac-scan, container-scan, waiver-check]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all security jobs
        env:
          SECRETS_RESULT: ${{ needs.secrets-scan.result }}
          SAST_RESULT: ${{ needs.sast-scan.result }}
          SCA_RESULT: ${{ needs.sca-scan.result }}
          IAC_RESULT: ${{ needs.iac-scan.result }}
          CONTAINER_RESULT: ${{ needs.container-scan.result }}
        run: |
          echo "## Security Gate Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Layer | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔐 Secrets | ${SECRETS_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🔍 SAST | ${SAST_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 SCA | ${SCA_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🏗️ IaC | ${IAC_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 🐳 Container | ${CONTAINER_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

          # Fail if any check failed
          if [ "${SECRETS_RESULT}" != "success" ] || \
             [ "${SAST_RESULT}" != "success" ] || \
             [ "${SCA_RESULT}" != "success" ] || \
             [ "${IAC_RESULT}" != "success" ] || \
             [ "${CONTAINER_RESULT}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **Security Gate: FAILED**" >> "$GITHUB_STEP_SUMMARY"
            echo "One or more security checks failed. Merge blocked." >> "$GITHUB_STEP_SUMMARY"
            echo ""
            echo "::error::Security Gate FAILED - One or more security checks did not pass"
            exit 1
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ **Security Gate: PASSED**" >> "$GITHUB_STEP_SUMMARY"
          echo "All security checks passed. Safe to proceed." >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # SBOM GENERATION & ARTIFACT SIGNING
  # Tools: Syft, cosign (keyless via Sigstore/Fulcio)
  # Control: Supply Chain Security, SLSA-aligned controls
  #
  # Note: This workflow implements SLSA-aligned supply chain controls including:
  #   - Keyless signing (Sigstore/Fulcio OIDC)
  #   - SBOM generation (SPDX + CycloneDX)
  #   - SBOM attestation
  # For full SLSA Level 2+ provenance, consider adding:
  #   - slsa-framework/slsa-github-generator
  # ===========================================================================
  sbom-and-sign:
    name: "📋 SBOM & Signing"
    needs: [security-gate]
    runs-on: ubuntu-latest
    if: needs.security-gate.result == 'success'
    permissions:
      contents: read
      packages: write
      id-token: write  # For keyless signing
    outputs:
      image-digest: ${{ steps.build-push.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build and push image
        id: build-push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.SCENARIO }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # SBOM Generation with Syft
      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom-spdx

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-cyclonedx

      # Cosign signing (keyless with Fulcio)
      - name: Install Cosign
        if: ${{ github.event.inputs.skip_signing != 'true' }}
        uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9 # v3

      - name: Sign container image
        if: ${{ github.event.inputs.skip_signing != 'true' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"

      - name: Attest SBOM
        if: ${{ github.event.inputs.skip_signing != 'true' }}
        env:
          COSIGN_EXPERIMENTAL: "true"
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign attest --yes \
            --predicate sbom.spdx.json \
            --type spdxjson \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"

      - name: Verify signature (demo)
        if: ${{ github.event.inputs.skip_signing != 'true' }}
        env:
          IMAGE_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${IMAGE_DIGEST}"

      - name: Generate attestation summary
        run: |
          echo "## Supply Chain Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM (SPDX) | ✅ Generated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM (CycloneDX) | ✅ Generated |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image Signature | ✅ Signed (Sigstore) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SBOM Attestation | ✅ Attested |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-artifacts
          path: |
            sbom.spdx.json
            sbom.cdx.json
          retention-days: 90

  # ===========================================================================
  # FINAL STATUS
  # ===========================================================================
  pipeline-status:
    name: "📊 Pipeline Status"
    needs: [security-gate, sbom-and-sign]
    runs-on: ubuntu-latest
    if: always()
    env:
      GATE_RESULT: ${{ needs.security-gate.result }}
      SBOM_RESULT: ${{ needs.sbom-and-sign.result }}
    steps:
      - name: Report final status
        run: |
          echo "## 🏁 Pipeline Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${GATE_RESULT}" == "success" ] && [ "${SBOM_RESULT}" == "success" ]; then
            echo "✅ **All checks passed. Artifact is production-ready.**" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Compliance Attestation" >> "$GITHUB_STEP_SUMMARY"
            echo "This build has passed security validation for:" >> "$GITHUB_STEP_SUMMARY"
            echo "- SOC 2 Type II (CC6.1, CC6.3, CC6.6, CC7.1)" >> "$GITHUB_STEP_SUMMARY"
            echo "- CNBV/IFPE (Art. 316 Bis)" >> "$GITHUB_STEP_SUMMARY"
            echo "- Banxico Circular 4/2021" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Pipeline failed. Review security findings.**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
